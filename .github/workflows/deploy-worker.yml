name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar Worker con llave API-Sports
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APISPORTS_KEY
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      - name: Verificar proveedor, partidos y sala pública
        run: |
          set -Eeuo pipefail
          BASE="https://deporte-total-360-api.damian970609.workers.dev"
          HEALTH="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/health")"
          CHAT="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/api/chat/messages")"
          node - "$HEALTH" "$CHAT" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const chat = JSON.parse(process.argv[3]);
          if (health.status !== "online") {
            throw new Error("El endpoint /health no confirmó que el Worker está online.");
          }
          if (health.provider_configured !== true) {
            throw new Error("El Worker está online, pero APISPORTS_KEY no está configurada.");
          }
          if (!Array.isArray(chat.messages)) {
            throw new Error("La sala pública no devolvió una lista de mensajes.");
          }
          console.log("Worker online; proveedor configurado; sala pública accesible; mensajes:", chat.messages.length);
          NODE

          FROM="$(date -u +%F)"
          TO="$(date -u -d '+6 days' +%F)"
          check_provider_route() {
            local route="$1"
            local label="$2"
            local body
            local status
            body="$(mktemp)"
            status="$(curl --silent --show-error --retry 2 --retry-delay 2 \
              --output "$body" --write-out '%{http_code}' "$BASE$route")"
            if [[ "$status" == "204" ]]; then
              echo "$label: proveedor respondió correctamente (sin eventos, HTTP 204)."
            elif [[ "$status" == "200" ]]; then
              node - "$body" "$label" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const label = process.argv[3];
          if (!payload || typeof payload !== "object" || !Array.isArray(payload.response)) {
            throw new Error(label + ": la respuesta no contiene response[]");
          }
          const errors = payload.errors;
          const hasErrors = Array.isArray(errors) ? errors.length > 0 :
            errors && typeof errors === "object" ? Object.keys(errors).length > 0 :
            Boolean(errors);
          if (hasErrors) throw new Error(label + ": el proveedor devolvió errores");
          console.log(label + ": consulta real correcta; eventos/registros: " + payload.response.length);
          NODE
            else
              echo "$label: error HTTP $status" >&2
              node - "$body" "$label" <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync(process.argv[2], "utf8");
          const label = process.argv[3];
          try {
            const payload = JSON.parse(raw);
            const redact = (value) => {
              if (Array.isArray(value)) return value.map(redact);
              if (value && typeof value === "object") {
                return Object.fromEntries(Object.entries(value).map(([key, item]) => [
                  key,
                  /key|token|secret|password|authorization/i.test(key) ? "[REDACTED]" : redact(item)
                ]));
              }
              if (typeof value === "string") {
                return value.replace(/(api[_-]?sports[_-]?key|authorization|bearer)\\s*[:=]\\s*[^\\s,;]+/ig, "$1=[REDACTED]");
              }
              return value;
            };
            console.error(label + " respuesta del Worker:", JSON.stringify(redact(payload)).slice(0, 3000));
          } catch {
            console.error(label + " respuesta del Worker (texto):", raw.slice(0, 1000));
          }
          NODE
              rm -f "$body"
              return 1
            fi
            rm -f "$body"
          }

          check_provider_route "/api/fixtures?from=$FROM&to=$TO&timezone=America%2FGuyana" "Agenda de fútbol"
          check_provider_route "/api/football/leagues?search=Premier" "Estadísticas de fútbol"
