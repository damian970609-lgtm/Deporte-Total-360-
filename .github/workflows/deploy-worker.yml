name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar Worker con llave API-Sports
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APISPORTS_KEY
            SPORTAPI_API_KEY
            GOOGLE_OAUTH_CLIENT_ID
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          SPORTAPI_API_KEY: ${{ secrets.SPORTAPI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}

      - name: Verificar proveedor, partidos, sala pública y OAuth
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -Eeuo pipefail
          BASE="https://deporte-total-360-api.damian970609.workers.dev"
          fetch_checked() {
            local route="$1"
            local response status body
            response="$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 20 -w 
          node - "$HEALTH" "$CHAT" "$OAUTH" "$GOOGLE_OAUTH_CLIENT_ID" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const chat = JSON.parse(process.argv[3]);
          const oauth = JSON.parse(process.argv[4]);
          const expectedOAuthClientId = process.argv[5];
          if (health.status !== "online") {
            throw new Error("El endpoint /health no confirmó que el Worker está online.");
          }
          if (health.provider_configured !== true) {
            throw new Error("El Worker está online, pero APISPORTS_KEY no está configurada.");
          }
          if (health.sportsapi_configured !== true) {
            throw new Error("El Worker está online, pero SPORTAPI_API_KEY no está configurada.");
          }
          if (health.channels_google_login_configured !== true) {
            throw new Error("Falta GOOGLE_OAUTH_CLIENT_ID en Cloudflare.");
          }
          if (oauth.configured !== true || oauth.clientId !== expectedOAuthClientId) {
            throw new Error("El cliente OAuth Web desplegado en Cloudflare no coincide con el secreto del repositorio.");
          }
          if (!Array.isArray(chat.messages)) {
            throw new Error("La sala pública no devolvió una lista de mensajes.");
          }
          console.log("Worker online; proveedor y OAuth configurados; sala pública accesible; mensajes:", chat.messages.length);
          NODE

          CATALOG="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/api/sports")"
          node - "$CATALOG" "$BASE" <<'NODE'
          (async () => {
            const catalog = JSON.parse(process.argv[2]);
            if (!Array.isArray(catalog.sports)) {
              throw new Error("El catálogo no devolvió sports[].");
            }
            const required = ["football", "basketball", "nba", "baseball", "american-football", "formula-1", "hockey", "handball", "rugby", "volleyball", "mma", "afl"];
            const available = new Set(catalog.sports.map((sport) => sport.id));
            const missing = required.filter((id) => !available.has(id));
            if (missing.length) {
              throw new Error("Faltan deportes en el catálogo: " + missing.join(", "));
            }
            console.log("Catálogo API-Sports disponible; deportes configurados:", catalog.sports.length);
            const favoritesResponse = await fetch(process.argv[3] + "/api/sportsapi/favorites");
            if (!favoritesResponse.ok) throw new Error("No se pudo consultar el catálogo de favoritos SportsAPI.app.");
            const favorites = await favoritesResponse.json();
            if (!Array.isArray(favorites.sports) || favorites.sports.length !== 10) {
              throw new Error("El catálogo SportsAPI.app no devolvió los diez deportes favoritos.");
            }
            console.log("Catálogo SportsAPI.app disponible; deportes favoritos:", favorites.sports.length);
            console.log("No se consultó el proveedor deportivo durante el despliegue para no consumir la cuota por minuto.");
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
