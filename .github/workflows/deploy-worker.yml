name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar Worker con llave API-Sports
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APISPORTS_KEY
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      - name: Verificar API y sala pública desplegadas
        run: |
          set -Eeuo pipefail
          BASE="https://deporte-total-360-api.damian970609.workers.dev"
          HEALTH="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/health")"
          CHAT="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/api/chat/messages")"
          node - "$HEALTH" "$CHAT" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const chat = JSON.parse(process.argv[3]);
          if (health.status !== "online") {
            throw new Error("El endpoint /health no confirmó que el Worker está online.");
          }
          if (!Array.isArray(chat.messages)) {
            throw new Error("La sala pública no devolvió una lista de mensajes.");
          }
          console.log("Worker online; sala pública accesible; mensajes:", chat.messages.length);
          NODE
