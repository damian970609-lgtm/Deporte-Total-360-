name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar pruebas
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar Worker con llave API-Sports
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APISPORTS_KEY
            SPORTAPI_API_KEY
            GOOGLE_OAUTH_CLIENT_ID
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          SPORTAPI_API_KEY: ${{ secrets.SPORTAPI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      - name: Verificar proveedor, partidos, sala pública y OAuth
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -Eeuo pipefail
          BASE="https://deporte-total-360-api.damian970609.workers.dev"
          fetch_json() {
            local route="$1"
            local tmp status
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --retry 1 --retry-delay 2 --max-time 20 -o "$tmp" -w '%{http_code}' "$BASE$route")"
            if [[ "$status" != "200" ]]; then
              echo "::error::La ruta $route respondió HTTP $status." >&2
              echo "Respuesta del Worker:" >&2
              sed -n '1,40p' "$tmp" >&2
              rm -f "$tmp"
              return 1
            fi
            cat "$tmp"
            rm -f "$tmp"
          }
          HEALTH="$(fetch_json /health)"
          CHANNELS_FILE="$(mktemp)"
          CHANNELS_STATUS="$(curl --silent --show-error --max-time 20 -o "$CHANNELS_FILE" -w '%{http_code}' "$BASE/api/channels")"
          CHANNELS_QUOTA_EXHAUSTED="false"
          if [[ "$CHANNELS_STATUS" == "200" ]]; then
            CHANNELS="$(cat "$CHANNELS_FILE")"
          elif grep -q "Exceeded allowed rows written in Durable Objects free tier" "$CHANNELS_FILE"; then
            CHANNELS_QUOTA_EXHAUSTED="true"
            CHANNELS='{"configured":false,"channels":[]}'
            echo "::warning::La cuota diaria gratuita de escrituras está agotada. El catálogo se volverá a verificar después del reinicio diario de Cloudflare (00:00 UTC)."
          else
            echo "::error::La ruta /api/channels respondió HTTP $CHANNELS_STATUS."
            sed -n '1,30p' "$CHANNELS_FILE" >&2
            rm -f "$CHANNELS_FILE"
            exit 1
          fi
          rm -f "$CHANNELS_FILE"
          OAUTH="$(fetch_json /api/channels/auth-config)"
          CATALOG="$(fetch_json /api/sports)"
          FAVORITES="$(fetch_json /api/sportsapi/favorites)"
          TODAY_UTC="$(date -u +%F)"
          FIXTURES="$(fetch_json "/api/sportsapi/fixtures?date=$TODAY_UTC&sport=football&page=0")"
          CHAT_FILE="$(mktemp)"
          CHAT_STATUS="$(curl --silent --show-error --max-time 20 -o "$CHAT_FILE" -w '%{http_code}' "$BASE/api/chat/messages")"
          if [[ "$CHAT_STATUS" == "200" ]]; then
            CHAT="$(cat "$CHAT_FILE")"
          else
            CHAT='{}'
            echo "::warning::El chat respondió HTTP $CHAT_STATUS; se verifica por separado y no bloquea el catálogo de canales."
            sed -n '1,10p' "$CHAT_FILE" >&2
          fi
          rm -f "$CHAT_FILE"
          node - "$HEALTH" "$CHANNELS" "$CHAT" "$CHAT_STATUS" "$CHANNELS_QUOTA_EXHAUSTED" "$OAUTH" "$GOOGLE_OAUTH_CLIENT_ID" "$CATALOG" "$FAVORITES" "$FIXTURES" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const channels = JSON.parse(process.argv[3]);
          const chat = JSON.parse(process.argv[4]);
          const chatStatus = process.argv[5];
          const channelsQuotaExhausted = process.argv[6] === "true";
          const oauth = JSON.parse(process.argv[7]);
          const expectedOAuthClientId = process.argv[8];
          const catalog = JSON.parse(process.argv[9]);
          const favorites = JSON.parse(process.argv[10]);
          const fixtures = JSON.parse(process.argv[11]);
          if (health.status !== "online") throw new Error("El endpoint /health no confirmó que el Worker está online.");
          if (health.provider_configured !== true) throw new Error("APISPORTS_KEY no está configurada.");
          if (health.sportsapi_configured !== true) throw new Error("SPORTAPI_API_KEY no está configurada.");
          if (health.channels_google_login_configured !== true) throw new Error("Falta GOOGLE_OAUTH_CLIENT_ID en Cloudflare.");
          if (oauth.configured !== true || oauth.clientId !== expectedOAuthClientId) throw new Error("El cliente OAuth Web desplegado no coincide con el secreto del repositorio.");
          if (!channelsQuotaExhausted &&
              (channels.configured !== true || !Array.isArray(channels.channels))) {
            throw new Error("El catálogo de Canales deportivos no respondió con una lista válida.");
          }
          if (channelsQuotaExhausted) {
            console.warn("La API de canales no se pudo comprobar porque Cloudflare agotó la cuota diaria gratuita de escrituras.");
          }
          if (chatStatus === "200" && !Array.isArray(chat.messages)) {
            throw new Error("El chat respondió 200 sin devolver una lista de mensajes.");
          }
          if (!Array.isArray(catalog.sports)) throw new Error("El catálogo no devolvió sports[].");
          const required = ["football", "basketball", "nba", "baseball", "american-football", "formula-1", "hockey", "handball", "rugby", "volleyball", "mma", "afl"];
          const available = new Set(catalog.sports.map((sport) => sport.id));
          const missing = required.filter((id) => !available.has(id));
          if (missing.length) throw new Error("Faltan deportes en el catálogo: " + missing.join(", "));
          if (!Array.isArray(favorites.sports) || favorites.sports.length !== 10) throw new Error("El catálogo SportsAPI.app no devolvió los diez deportes favoritos.");
          if (!Array.isArray(fixtures.data)) throw new Error("SportsAPI no devolvió data[] en la ruta real de partidos.");
          console.log("Worker online; OAuth, canales, deportes, favoritos y ruta real de fixtures verificados.");
          console.log("Partidos recibidos en la consulta de prueba:", fixtures.data.length);
          console.log("Mensajes de chat disponibles:", Array.isArray(chat.messages) ? chat.messages.length : "chat temporalmente no disponible");
          NODE
