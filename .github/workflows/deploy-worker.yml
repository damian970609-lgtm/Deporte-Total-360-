name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar Worker con llave API-Sports
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APISPORTS_KEY
            SPORTAPI_API_KEY
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          SPORTAPI_API_KEY: ${{ secrets.SPORTAPI_API_KEY }}

      - name: Verificar proveedor, partidos y sala pública
        run: |
          set -Eeuo pipefail
          BASE="https://deporte-total-360-api.damian970609.workers.dev"
          HEALTH="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/health")"
          CHAT="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/api/chat/messages")"
          SCHEDULE="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/api/live/auto/schedule")"
          node - "$HEALTH" "$CHAT" "$SCHEDULE" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const chat = JSON.parse(process.argv[3]);
          const schedule = JSON.parse(process.argv[4]);
          if (health.status !== "online") {
            throw new Error("El endpoint /health no confirmó que el Worker está online.");
          }
          if (health.provider_configured !== true) {
            throw new Error("El Worker está online, pero no tiene una clave de proveedor deportivo configurada.");
          }
          if (health.sportsapi_configured !== true) {
            throw new Error("Falta SPORTAPI_API_KEY en los secretos Actions del repositorio del Worker.");
          }
          if (health.automatic_live_scheduler_configured !== true) {
            throw new Error("El planificador automático no está conectado al Worker.");
          }
          if (!Array.isArray(schedule.events) ||
              !["ok", "stale", "pending", "source_unavailable"].includes(schedule.status)) {
            throw new Error("La ruta central de agenda/transmisiones no devolvió el formato esperado.");
          }
          if (!Array.isArray(chat.messages)) {
            throw new Error("La sala pública no devolvió una lista de mensajes.");
          }
          console.log("Worker online; proveedor configurado; sala pública accesible; mensajes:", chat.messages.length);
          console.log("Planificador central:", schedule.status, "eventos:", schedule.events.length,
            "actualizado:", schedule.updatedAt || "pendiente",
            "diagnóstico:", schedule.sourceError || "sin errores reportados");
          NODE

          CATALOG="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/api/sports")"
          node - "$CATALOG" <<'NODE'
          const catalog = JSON.parse(process.argv[2]);
          if (!Array.isArray(catalog.sports)) {
            throw new Error("El catálogo no devolvió sports[].");
          }
          const required = ["football", "basketball", "nba", "baseball", "american-football", "formula-1", "hockey", "handball", "rugby", "volleyball", "mma", "afl"];
          const available = new Set(catalog.sports.map((sport) => sport.id));
          const missing = required.filter((id) => !available.has(id));
          if (missing.length) {
            throw new Error("Faltan deportes en el catálogo: " + missing.join(", "));
          }
          console.log("Catálogo API disponible; deportes configurados:", catalog.sports.length);
          console.log("No se consultó el proveedor deportivo durante el despliegue para no consumir la cuota por minuto.");
          NODE
