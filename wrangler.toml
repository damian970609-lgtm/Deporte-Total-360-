name = "deporte-total-360-api"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = true

[observability]
enabled = true


[[durable_objects.bindings]]
name = "PUBLIC_CHAT_ROOM"
class_name = "PublicChatRoom"

[[migrations]]
tag = "v1-public-chat"
new_sqlite_classes = ["PublicChatRoom"]

[[durable_objects.bindings]]
name = "AUTOMATIC_LIVE_SCHEDULE"
class_name = "AutomaticLiveSchedule"

[[migrations]]
tag = "v2-automatic-live-schedule"
new_sqlite_classes = ["AutomaticLiveSchedule"]

[triggers]
crons = ["* * * * *"]
