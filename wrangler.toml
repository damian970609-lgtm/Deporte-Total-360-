name = "deporte-total-360-api"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = true

[observability]
enabled = true


[[durable_objects.bindings]]
name = "PUBLIC_CHAT_ROOM"
class_name = "PublicChatRoom"

[[migrations]]
tag = "v1-public-chat"
new_sqlite_classes = ["PublicChatRoom"]

[[durable_objects.bindings]]
name = "CHANNEL_CATALOG"
class_name = "ChannelCatalogRoom"

[[migrations]]
tag = "v2-channel-catalog"
new_sqlite_classes = ["ChannelCatalogRoom"]

[triggers]
# Ejecuta a los cinco minutos de cada bloque de seis horas para que el
# primer reintento tras el reinicio diario de cuotas (00:00 UTC) ocurra 00:05.
crons = ["5 */6 * * *"]

[vars]
CHANNELS_ADMIN_EMAIL = "damian970609@gmail.com"
